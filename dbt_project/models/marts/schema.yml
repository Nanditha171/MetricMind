version: 2

models:
  - name: fct_sales
    description: "Governed Fact Table for Corporate Sales, Costs, and Margin Analytics"
    columns:
      - name: order_id
        description: "Primary key for orders"
        tests:
          - unique
          - not_null
      - name: revenue
        description: "Authoritative metric: SUM(revenue)"
      - name: cost
        description: "Authoritative metric: SUM(cost)"
      - name: margin
        description: "Authoritative metric: SUM(revenue - cost)"
      - name: margin_pct
        description: "Authoritative metric: SUM(revenue - cost) / SUM(revenue) * 100"
      - name: material_cost
        description: "Authoritative metric: SUM(material_cost)"
      - name: shipping_cost
        description: "Authoritative metric: SUM(shipping_cost)"

metrics:
  - name: revenue
    label: "Total Revenue"
    model: ref('fct_sales')
    description: "Sum of total sales revenue"
    type: simple
    type_params:
      measure: revenue

  - name: margin_pct
    label: "Margin Percentage"
    model: ref('fct_sales')
    description: "Net operating margin percentage"
    type: expression
    type_params:
      expr: "(margin / revenue) * 100"
